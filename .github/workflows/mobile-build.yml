name: Validate unsigned mobile builds

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Run portable tests
        run: >-
          flutter test
          test/battle_control_test.dart
          test/battle_render_policy_test.dart
          test/content_catalog_test.dart
          test/mobile_orientation_test.dart
          test/performance_profiler_test.dart
          test/release_configuration_test.dart
          test/repository_test.dart
          test/spatial_hash_benchmark_test.dart
          test/widget_test.dart
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-mercenaries-beta-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios-unsigned:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-mercenaries-beta-ios-unsigned
          path: build/ios/iphoneos/Runner.app
