name: 버그 리포트
description: 진행 불가, 화면 오류, 저장 또는 전투 문제를 알려주세요.
title: "[Bug] "
labels: [bug, playtest]
body:
  - type: dropdown
    id: device
    attributes:
      label: 테스트 환경
      options:
        - Android 앱 빌드
        - iPhone/iPad 앱 빌드
        - Android 모바일 브라우저
        - iPhone 모바일 브라우저
        - Windows 데스크톱 브라우저
        - macOS 데스크톱 브라우저
        - 기타
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 앱 빌드 또는 브라우저와 버전
      placeholder: 예) Beta 0.1.0+12, Chrome 140, Safari 20
    validations:
      required: true
  - type: input
    id: device_model
    attributes:
      label: 기기 모델, OS, 화면 크기
      placeholder: 예) Galaxy S24 / Android 16 / 20:9 가로
    validations:
      required: true
  - type: input
    id: battle_context
    attributes:
      label: 전투 재현 정보
      description: 가능한 경우 seed, 전장, 용병, 무기와 남은 시간을 적어주세요.
      placeholder: 예) seed 19 / 성문 방어전 / 루나 / 월광쌍검 / 03:21
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 캠프부터 문제가 발생할 때까지의 행동을 순서대로 작성해주세요.
      placeholder: |
        1. 전쟁터 출전 선택
        2. 성문 방어전 시작
        3. 레벨업 선택 후 화면 정지
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 실제 결과와 예상 결과
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 스크린샷 또는 추가 정보
      description: 가능하면 화면 크기, 남은 전투 시간과 선택한 용병도 적어주세요.
  - type: checkboxes
    id: save_notice
    attributes:
      label: 저장 데이터 안내
      options:
        - label: 제보에 비밀번호, 개인 정보 또는 민감한 브라우저 데이터를 포함하지 않았습니다.
          required: true
